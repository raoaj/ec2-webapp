name: Deploy webapp Website to EC2
on: workflow_dispatch

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

    steps:
      - name: Deploy to EC2
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/ec2.pem "ubuntu@$EC2_HOST" 'bash -se' <<'EOF'
          APP="/home/ubuntu/ec2-webapp"
          if [ -d "$APP/.git" ]; then
            cd "$APP"
            git pull --ff-only origin main
          else
            git clone -b main "https://github.com/${{ github.repository }}.git" "$APP"
          fi
          EOF
